# Grafana-managed alerts. Change these files and redeploy to update thresholds.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: da-moa-discord-dm
    receivers:
      - uid: da-moa-discord
        type: webhook
        disableResolveMessage: false
        settings:
          url: https://discord.com/api/v10/channels/${DISCORD_DM_CHANNEL_ID}/messages
          httpMethod: POST
          authorization_scheme: Bot
          authorization_credentials: $DISCORD_BOT_TOKEN
          payload:
            template: '{{ coll.Dict "content" (printf "[%s] 다모아 · %s\n%.400s" .Status .CommonLabels.alertname .CommonAnnotations.summary) "allowed_mentions" (coll.Dict "parse" (coll.Slice)) | data.ToJSON }}'

groups:
  - orgId: 1
    name: da-moa
    folder: 다모아 운영
    interval: 30s
    rules:
      - &rule
        uid: da-moa-app-down
        title: 다모아 앱 장애
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels: { service: da-moa, severity: critical }
        annotations:
          summary: 앱이 1분 동안 응답하지 않습니다.
          description: 앱 컨테이너와 /api/health/live 응답을 확인하세요. DB·MinIO 검사는 앱이 응답할 때만 장애를 판정합니다.
        dashboardUid: da-moa-health
        panelId: 1
        notification_settings:
          receiver: da-moa-discord-dm
          group_by: [grafana_folder, alertname]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 4h
        data:
          - &query
            refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              &prometheus
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: '1 - (min(probe_success{job="health",check="live"} or up{job="health",check="live"}) or vector(0))'
          - &condition
            refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              &math
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: $A > 0

      - <<: *rule
        uid: da-moa-database-down
        title: 다모아 DB 장애
        annotations:
          summary: PostgreSQL 연결 검사가 1분 동안 실패했습니다.
          description: 앱은 응답하지만 SELECT 1 검사가 실패합니다. PostgreSQL 컨테이너·연결·인증 설정을 확인하세요.
        panelId: 2
        data:
          - <<: *query
            model:
              <<: *prometheus
              expr: '((min(probe_success{job="health",check="database"} or up{job="health",check="database"}) or vector(0)) == bool 0) * ((min(probe_success{job="health",check="live"} or up{job="health",check="live"}) or vector(0)) == bool 1)'
          - *condition

      - <<: *rule
        uid: da-moa-minio-down
        title: 다모아 MinIO 장애
        annotations:
          summary: MinIO 상태 검사가 1분 동안 실패했습니다.
          description: 앱은 응답하지만 MinIO 읽기·쓰기 정족수 검사가 실패합니다. MinIO 컨테이너·네트워크·디스크를 확인하세요.
        panelId: 3
        data:
          - <<: *query
            model:
              <<: *prometheus
              expr: '((min(probe_success{job="health",check="minio"} or up{job="health",check="minio"}) or vector(0)) == bool 0) * ((min(probe_success{job="health",check="live"} or up{job="health",check="live"}) or vector(0)) == bool 1)'
          - *condition

      - <<: *rule
        uid: da-moa-cpu-critical
        title: 다모아 CPU 90% 이상
        for: 2m
        noDataState: NoData
        annotations:
          summary: 서버 CPU 사용률이 90% 이상으로 2분 지속되었습니다.
          description: 전체 CPU의 최근 5분 평균 사용률입니다. CPU를 많이 사용하는 프로세스를 확인하세요.
        dashboardUid: da-moa-resources
        panelId: 1
        data:
          - &cpu
            <<: *query
            model:
              <<: *prometheus
              expr: '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])))'
          - &critical
            <<: *condition
            model:
              <<: *math
              expression: $A >= 90

      - <<: *rule
        uid: da-moa-memory-critical
        title: 다모아 메모리 90% 이상
        for: 2m
        noDataState: NoData
        annotations:
          summary: 서버 메모리 사용률이 90% 이상으로 2분 지속되었습니다.
          description: MemAvailable을 제외한 서버 전체 메모리 사용률입니다. 메모리를 많이 사용하는 프로세스를 확인하세요.
        dashboardUid: da-moa-resources
        panelId: 2
        data:
          - &memory
            <<: *query
            model:
              <<: *prometheus
              expr: '100 * (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})'
          - *critical

      - <<: *rule
        uid: da-moa-cpu-warning
        title: 다모아 CPU 50% 이상
        for: 5m
        noDataState: NoData
        labels: { service: da-moa, severity: warning }
        annotations:
          summary: 서버 CPU 사용률이 50% 이상 90% 미만으로 5분 지속되었습니다.
          description: 전체 CPU의 최근 5분 평균 사용률입니다. 90% 이상에서는 위험 알림으로 전환합니다.
        dashboardUid: da-moa-resources
        panelId: 1
        data:
          - *cpu
          - &warning
            <<: *condition
            model:
              <<: *math
              expression: $A >= 50 && $A < 90

      - <<: *rule
        uid: da-moa-memory-warning
        title: 다모아 메모리 50% 이상
        for: 5m
        noDataState: NoData
        labels: { service: da-moa, severity: warning }
        annotations:
          summary: 서버 메모리 사용률이 50% 이상 90% 미만으로 5분 지속되었습니다.
          description: MemAvailable을 제외한 서버 전체 메모리 사용률입니다. 90% 이상에서는 위험 알림으로 전환합니다.
        dashboardUid: da-moa-resources
        panelId: 2
        data:
          - *memory
          - *warning

      - <<: *rule
        uid: da-moa-latency-p95
        title: 다모아 P95 응답시간 1초 초과
        for: 2m
        noDataState: OK
        labels: { service: da-moa, severity: warning }
        annotations:
          summary: 최근 5분 P95 응답시간이 1초를 초과한 상태가 2분 지속되었습니다.
          description: 완료된 앱 HTTP 요청 기준이며 헬스체크·정적 파일·내부 요청은 제외합니다. 요청이 없으면 알림을 보내지 않습니다.
        dashboardUid: da-moa-health
        panelId: 6
        data:
          - <<: *query
            model:
              <<: *prometheus
              expr: 'histogram_quantile(0.95, sum by (le) (rate(da_moa_http_request_duration_seconds_bucket{job="app"}[5m]))) and on() (sum(rate(da_moa_http_request_duration_seconds_count{job="app"}[5m])) > 0)'
          - <<: *condition
            model:
              <<: *math
              expression: $A > 1
