services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: da_moa_dev
      POSTGRES_USER: da_moa
      POSTGRES_PASSWORD: da_moa_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da_moa -d da_moa_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: da_moa_local
      MINIO_ROOT_PASSWORD: da_moa_minio_local
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - minio-dev-data:/data

volumes:
  postgres-dev-data:
  minio-dev-data:
