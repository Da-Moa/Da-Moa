services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: da_moa_dev
      POSTGRES_USER: da_moa
      POSTGRES_PASSWORD: da_moa_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da_moa -d da_moa_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
