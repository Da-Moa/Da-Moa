# Include once inside the application's HTTPS server block.
# Locations inherit both rules, including the separate receipt-upload location.
limit_req zone=da_moa_api burst=50 nodelay;
limit_req zone=da_moa_login burst=5 nodelay;
limit_req_status 429;
error_page 429 = @da_moa_rate_limited;

location @da_moa_rate_limited {
    default_type application/json;
    add_header Retry-After $da_moa_limit_retry_after always;
    add_header Cache-Control "no-store" always;
    return 429 '{"error":"rate_limited","message":"요청이 많아요. 잠시 후 다시 시도해 주세요."}';
}
