# Install in /etc/nginx/conf.d/da-moa-rate-limit.conf (http context).
# Empty keys exempt pages/static files; the same key shares the API budget across locations.
map $uri $da_moa_api_limit_key {
    default "";
    ~^/api(?:/|$) da_moa_api;
    /realtime da_moa_api;
    /auth/v1/kakao da_moa_api;
}

map $uri $da_moa_login_limit_key {
    default "";
    ~^/api/auth/kakao/?$ $binary_remote_addr;
}

map $da_moa_login_limit_key $da_moa_limit_retry_after {
    "" 1;
    default 6;
}

# 330 RPS measured mixed workload x 90% = 297 RPS.
limit_req_zone $da_moa_api_limit_key zone=da_moa_api:1m rate=297r/s;
limit_req_zone $da_moa_login_limit_key zone=da_moa_login:1m rate=10r/m;
