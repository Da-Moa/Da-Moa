name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the SHA image for verification (only main updates latest and deploys)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    concurrency:
      group: da-moa-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ghcr.io/da-moa/da-moa:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production image
        env:
          APP_IMAGE: ghcr.io/da-moa/da-moa:${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$APP_IMAGE" --format '{{.Architecture}}')" = arm64
          container="da-moa-ci-$GITHUB_RUN_ID"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          docker run -d --name "$container" -e HOST=0.0.0.0 -e RECEIPT_WORKER_ENABLED=false -p 127.0.0.1::3000 "$APP_IMAGE"
          port=$(docker port "$container" 3000/tcp | cut -d: -f2)
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --retry-max-time 60 --max-time 5 "http://127.0.0.1:$port/api/health/live"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.publish_image)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.publish_image)
        run: |
          set -euo pipefail
          image=ghcr.io/da-moa/da-moa
          docker push "$image:$GITHUB_SHA"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag "$image:$GITHUB_SHA" "$image:latest"
            docker push "$image:latest"
          fi
          reference=$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          [[ "$reference" =~ ^ghcr\.io/da-moa/da-moa@sha256:[0-9a-f]{64}$ ]]
          echo "image=$reference" >> "$GITHUB_OUTPUT"
      - name: Prune unused Docker resources
        if: always()
        run: sudo docker system prune -a --volumes -f

  integration:
    name: Nest DB / ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: domain
            database: da_moa_domain_test
            postgres_port: 15440
            test_script: test:domain
          - kind: integration
            database: da_moa_integration_test
            postgres_port: 25440
            test_script: test:integration
          - kind: backend-scenario
            database: da_moa_scenario_test
            postgres_port: 35440
            test_script: test:scenario
    env:
      CI_COMPOSE_PROJECT: da-moa-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kind }}
      CI_ARTIFACT_DIR: test-results/${{ matrix.kind }}
      CI_TEST_DATABASE: ${{ matrix.database }}
      CI_TEST_POSTGRES_PORT: ${{ matrix.postgres_port }}
      TEST_DATABASE_URL: postgresql://da_moa_ci:da_moa_ci_test@127.0.0.1:${{ matrix.postgres_port }}/${{ matrix.database }}
      AUTH_JWT_SECRET: ci-only-nest-db-test-secret-at-least-32-bytes
      RECEIPT_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          docker compose -f compose.mock-test.yaml -p "$CI_COMPOSE_PROJECT" up -d --wait --wait-timeout 60
      - name: Test injected Nest requests and real database contracts
        run: |
          set -euo pipefail
          npm run ${{ matrix.test_script }} 2>&1 | tee "$CI_ARTIFACT_DIR/tests.log"
      - name: Collect service logs and remove owned resources
        if: always()
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          docker compose -f compose.mock-test.yaml -p "$CI_COMPOSE_PROJECT" logs --no-color > "$CI_ARTIFACT_DIR/services.log" 2>&1 || true
          docker compose -f compose.mock-test.yaml -p "$CI_COMPOSE_PROJECT" down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nest-db-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          retention-days: 7
      - name: Prune unused Docker resources
        if: always()
        run: sudo docker system prune -a --volumes -f

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-and-build, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          APP_SHA: ${{ github.sha }}
          IMAGE_REF: ${{ needs.test-and-build.outputs.image }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Set repository secret DEPLOY_DISPATCH_TOKEN with Contents write access to Da-Moa/Deploy}"
          jq -n --arg sha "$APP_SHA" --arg image "$IMAGE_REF" \
            '{event_type:"image-published",client_payload:{app_sha:$sha,image:$image}}' \
            | gh api --method POST repos/Da-Moa/Deploy/dispatches --input -
