name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_nginx:
        description: Apply Nginx rate limits (requires the server include and sudo)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-and-build
    uses: Da-Moa/Deploy/.github/workflows/deploy.yml@9552fc4bc40f28be7462f35b096be74e94847521
    with:
      app-sha: ${{ github.sha }}
      deploy-sha: 9552fc4bc40f28be7462f35b096be74e94847521
      apply-nginx: ${{ inputs.apply_nginx || false }}
    secrets: inherit
