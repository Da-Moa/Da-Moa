services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${CI_TEST_POSTGRES_PORT:?CI_TEST_POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_DB: "${CI_TEST_DATABASE:?CI_TEST_DATABASE is required}"
      POSTGRES_USER: da_moa_ci
      POSTGRES_PASSWORD: da_moa_ci_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da_moa_ci -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data
    ports:
      - "127.0.0.1:${CI_TEST_MINIO_PORT:?CI_TEST_MINIO_PORT is required}:9000"
    environment:
      MINIO_ROOT_USER: da_moa_ci
      MINIO_ROOT_PASSWORD: da_moa_ci_minio_test
      MINIO_TEST_BUCKET: "${MINIO_BUCKET:?MINIO_BUCKET is required}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
