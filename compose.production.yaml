services:
  app:
    build: .
    image: da-moa-app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: da_moa
      POSTGRES_USER: da_moa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da_moa -d da_moa"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/aistor/minio@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
    restart: unless-stopped
    command: server /mnt/data --console-address ":9001" --license /minio.license
    env_file: .minio.env
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/mnt/data
      - /srv/da-moa/shared/minio.license:/minio.license:ro

volumes:
  postgres-data:
  minio-data:
